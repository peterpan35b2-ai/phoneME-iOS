# iOS Simulator arm64 CLDC VM using phoneME's portable C interpreter.

export ENABLE_C_INTERPRETER     := true
export ENABLE_C_INTERPRETER__BY := ios_simulator_arm64.cfg

export ENABLE_PCSL     := true
export ENABLE_PCSL__BY := ios_simulator_arm64.cfg

host_os     = darwin
host_arch   = arm64
os          = darwin
os_family   = linux
target_os   = darwin
compiler    = gcc
arch        = c
target_arch = arm64

USER_CFLAGS += -DJVM_64BIT=1 -DARM64=1 -DPHONEME_IOS_NATIVE=1

LOOP_GEN_FLAGS = +GenerateGNUCode
ROM_GEN_FLAGS  = +GenerateGNUCode

ifndef ENABLE_TIMER_THREAD
export ENABLE_TIMER_THREAD     := true
export ENABLE_TIMER_THREAD__BY := ios_simulator_arm64.cfg
endif

export ENABLE_INTERPRETER_GENERATOR     := false
export ENABLE_INTERPRETER_GENERATOR__BY := ios_simulator_arm64.cfg

export ENABLE_COMPILER     := false
export ENABLE_COMPILER__BY := ios_simulator_arm64.cfg

ifndef MERGE_SOURCE_FILES
MERGE_SOURCE_FILES = true
endif

ifndef SOURCE_MERGER_SIZE
SOURCE_MERGER_SIZE = 35
endif

ifeq ($(IsTarget),true)
IOS_DEPLOYMENT_TARGET ?= 16.0
IOS_SDKROOT := $(shell xcrun --sdk iphonesimulator --show-sdk-path)
FORCE_GCC = xcrun --sdk iphonesimulator clang -target arm64-apple-ios$(IOS_DEPLOYMENT_TARGET)-simulator -isysroot $(IOS_SDKROOT) -mios-simulator-version-min=$(IOS_DEPLOYMENT_TARGET)
override ASM_gcc = $(FORCE_GCC) -c
SUPPORTS_MONOTONIC_CLOCK = false
endif
