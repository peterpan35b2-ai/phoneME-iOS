# iOS arm64 CLDC VM using phoneME's portable C interpreter.

export ENABLE_C_INTERPRETER     := true
export ENABLE_C_INTERPRETER__BY := ios_arm64.cfg

export ENABLE_PCSL     := true
export ENABLE_PCSL__BY := ios_arm64.cfg

host_os     = darwin
host_arch   = arm64
os          = darwin
os_family   = linux
target_os   = darwin
compiler    = gcc
arch        = c
target_arch = arm64

USER_CFLAGS += -DJVM_64BIT=1 -DARM64=1 -DPHONEME_IOS_NATIVE=1
USER_CFLAGS += -Werror=pointer-to-int-cast -Werror=int-to-pointer-cast
USER_CFLAGS += -Werror=void-pointer-to-int-cast -Werror=int-to-void-pointer-cast

LOOP_GEN_FLAGS = +GenerateGNUCode
ROM_GEN_FLAGS  = +GenerateGNUCode

ifndef ENABLE_TIMER_THREAD
export ENABLE_TIMER_THREAD     := true
export ENABLE_TIMER_THREAD__BY := ios_arm64.cfg
endif

export ENABLE_INTERPRETER_GENERATOR     := false
export ENABLE_INTERPRETER_GENERATOR__BY := ios_arm64.cfg

export ENABLE_COMPILER     := false
export ENABLE_COMPILER__BY := ios_arm64.cfg

# The preinitialized task-mirror ROM section stores references as 32-bit
# serialized words. Use the normal dynamic mirror initialization path on LP64.
export ENABLE_PREINITED_TASK_MIRRORS     := false
export ENABLE_PREINITED_TASK_MIRRORS__BY := ios_arm64.cfg

# Monet/binary ROM and RMFS persist native references in legacy 32-bit formats.
export ENABLE_MONET     := false
export ENABLE_MONET__BY := ios_arm64.cfg
export ENABLE_RMFS      := false
export ENABLE_RMFS__BY  := ios_arm64.cfg

# Compile every VM translation unit independently. Merged sources hide
# per-file diagnostics and can accidentally mix incompatible legacy defines.
override MERGE_SOURCE_FILES = false
override SOURCE_MERGER_SIZE = 1

# Host tools remain native macOS executables. Only target objects use the
# iPhoneOS SDK and deployment target.
ifeq ($(IsTarget),true)
IOS_DEPLOYMENT_TARGET ?= 16.0
IOS_SDKROOT := $(shell xcrun --sdk iphoneos --show-sdk-path)
FORCE_GCC = xcrun --sdk iphoneos clang -target arm64-apple-ios$(IOS_DEPLOYMENT_TARGET) -isysroot $(IOS_SDKROOT) -miphoneos-version-min=$(IOS_DEPLOYMENT_TARGET)
# The iOS port uses the portable C bytecode interpreter. Optimize its hot
# dispatch/handler path for speed; the generic release makefile only uses -O2.
USER_CFLAGS += -O3
override ASM_gcc = $(FORCE_GCC) -c
SUPPORTS_MONOTONIC_CLOCK = false
endif
