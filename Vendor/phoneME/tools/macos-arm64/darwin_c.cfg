# Native macOS configuration using phoneME's portable C interpreter.

export ENABLE_C_INTERPRETER     := true
export ENABLE_C_INTERPRETER__BY := darwin_c.cfg

# MIDP requires PCSL for suite storage, RMS, files and networking.
export ENABLE_PCSL     := true
export ENABLE_PCSL__BY := darwin_c.cfg

host_os     = darwin
host_arch   = arm64
os          = darwin
# Reuse the POSIX/Linux implementation sources, but export Darwin as the
# actual target OS so MIDP accepts the generated CLDC distribution metadata.
os_family   = linux
target_os   = darwin
compiler    = gcc
arch        = c
target_arch = arm64

# Java primitive widths stay unchanged. Native VM words, object references,
# frames and native handles use the 64-bit host pointer width.
USER_CFLAGS += -DJVM_64BIT=1 -DARM64=1

LOOP_GEN_FLAGS = +GenerateGNUCode
ROM_GEN_FLAGS  = +GenerateGNUCode

ifndef ENABLE_TIMER_THREAD
export ENABLE_TIMER_THREAD     := true
export ENABLE_TIMER_THREAD__BY := darwin_c.cfg
endif

export ENABLE_INTERPRETER_GENERATOR     := false
export ENABLE_INTERPRETER_GENERATOR__BY := darwin_c.cfg

# The ARM32 compiler/JIT backend is not valid for AArch64. Use the portable
# C interpreter until a dedicated arm64 code generator is implemented.
export ENABLE_COMPILER     := false
export ENABLE_COMPILER__BY := darwin_c.cfg

ifndef MERGE_SOURCE_FILES
MERGE_SOURCE_FILES = true
endif

ifndef SOURCE_MERGER_SIZE
SOURCE_MERGER_SIZE = 35
endif
